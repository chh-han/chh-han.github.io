<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ChangHeon Han</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #F1EEE6; }
    body { font-family: 'Geist', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #15171B; }
    #root { min-height: 100vh; }
    *, *::before, *::after { box-sizing: border-box; }

    /* Subtle fade between pages */
    .page-fade { animation: pageFade 0.32s cubic-bezier(.2,.7,.3,1) both; }
    @keyframes pageFade {
      0%   { opacity: 0.4; transform: translateY(4px); }
      100% { opacity: 1;   transform: translateY(0); }
    }

    /* ─────────────────────────────────────────────────────────────
       Mobile-friendly overrides
       The site uses inline styles throughout, so we override them
       via attribute selectors + !important inside media queries.
       Desktop layout is fully untouched.
       ───────────────────────────────────────────────────────────── */
    @media (max-width: 900px) {
      /* Allow whole page to use full viewport width */
      html, body { overflow-x: hidden; }

      /* Reduce 56px horizontal padding → 20px on every section */
      [style*="padding: 64px 56px"],
      [style*="padding: 56px 56px"],
      [style*="padding: 48px 56px"],
      [style*="padding: 40px 56px"],
      [style*="padding: 32px 56px"],
      [style*="padding: 0 56px"],
      [style*="padding: 0px 56px"] {
        padding-left: 20px !important;
        padding-right: 20px !important;
      }

      /* Reduce vertical padding a bit too on big sections */
      [style*="padding: 64px 56px 48px"] { padding-top: 36px !important; padding-bottom: 28px !important; }
      [style*="padding: 56px 56px 64px"] { padding-top: 36px !important; padding-bottom: 40px !important; }
      [style*="padding: 56px 56px 40px"] { padding-top: 36px !important; padding-bottom: 28px !important; }
      [style*="padding: 56px 56px 32px"] { padding-top: 36px !important; padding-bottom: 24px !important; }
      [style*="padding: 48px 56px 64px"] { padding-top: 32px !important; padding-bottom: 40px !important; }
      [style*="padding: 48px 56px 40px"] { padding-top: 32px !important; padding-bottom: 28px !important; }
      [style*="padding: 48px 56px 32px"] { padding-top: 32px !important; padding-bottom: 24px !important; }
      [style*="padding: 40px 56px 24px"] { padding-top: 28px !important; padding-bottom: 20px !important; }

      /* Stack multi-column grids */
      [style*="grid-template-columns: 1fr 380px"],
      [style*="grid-template-columns: 1fr 1fr"],
      [style*="grid-template-columns: 1fr 1fr 1fr"],
      [style*="grid-template-columns: repeat(4"],
      [style*="grid-template-columns: 2fr 1fr 1fr 1fr"],
      [style*="grid-template-columns: 180px 1fr"] {
        grid-template-columns: 1fr !important;
        gap: 20px !important;
      }

      /* Hero portrait — cap width so it doesn't fill the screen */
      [style*="aspect-ratio: 4/5"],
      [style*="aspect-ratio: 4 / 5"] {
        max-width: 280px;
      }

      /* News rows (120px 80px 1fr auto) — stack to a single column,
         hide the trailing 0X/0Y counter to save vertical space */
      [style*="grid-template-columns: 120px 80px 1fr auto"] {
        grid-template-columns: auto auto 1fr !important;
        column-gap: 12px !important;
        row-gap: 4px !important;
      }
      [style*="grid-template-columns: 120px 80px 1fr auto"] > *:nth-child(3) {
        grid-column: 1 / -1 !important;
      }
      [style*="grid-template-columns: 120px 80px 1fr auto"] > *:nth-child(4) {
        display: none !important;
      }

      /* Research item rows (90px 1fr 200px) — stack cover full-width below */
      [style*="grid-template-columns: 90px 1fr 200px"] {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
      }
      [style*="grid-template-columns: 90px 1fr 200px"] > *:nth-child(3) img,
      [style*="grid-template-columns: 90px 1fr 200px"] > *:nth-child(3) > div {
        max-width: 260px;
      }

      /* Release rows (56px 110px 1fr auto) — 2-col w/ thumb + content stack */
      [style*="grid-template-columns: 56px 110px 1fr auto"] {
        grid-template-columns: 48px 1fr !important;
        column-gap: 12px !important;
        row-gap: 8px !important;
        align-items: start !important;
      }
      [style*="grid-template-columns: 56px 110px 1fr auto"] > *:nth-child(2),
      [style*="grid-template-columns: 56px 110px 1fr auto"] > *:nth-child(3),
      [style*="grid-template-columns: 56px 110px 1fr auto"] > *:nth-child(4) {
        grid-column: 2 / -1 !important;
      }

      /* Bio event rows (160px 70px 1fr 160px) — stack everything */
      [style*="grid-template-columns: 160px 70px 1fr 160px"] {
        grid-template-columns: auto auto !important;
        column-gap: 10px !important;
        row-gap: 4px !important;
      }
      [style*="grid-template-columns: 160px 70px 1fr 160px"] > *:nth-child(3) {
        grid-column: 1 / -1 !important;
      }
      [style*="grid-template-columns: 160px 70px 1fr 160px"] > *:nth-child(4) {
        grid-column: 1 / -1 !important;
        text-align: left !important;
      }

      /* Big editorial type — scale down */
      [style*="font-size: 96px"] { font-size: 52px !important; line-height: 0.95 !important; }
      [style*="font-size: 88px"] { font-size: 48px !important; line-height: 0.98 !important; }
      [style*="font-size: 56px"] { font-size: 36px !important; }
      [style*="font-size: 32px"] {
        font-size: 22px !important;
        word-break: break-all;
      }

      /* Top nav — let items wrap, kill sticky height */
      [style*="height: 64px"][style*="position: sticky"] {
        height: auto !important;
        flex-wrap: wrap !important;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
        gap: 10px !important;
      }
      [style*="height: 64px"][style*="position: sticky"] > div:last-child {
        gap: 14px !important;
        flex-wrap: wrap !important;
        row-gap: 8px !important;
      }

      /* Footer — wrap */
      [style*="padding: 32px 56px"][style*="border-top"],
      [style*="padding: 32px 20px"][style*="border-top"] {
        flex-wrap: wrap !important;
        gap: 16px !important;
        align-items: flex-start !important;
      }
      [style*="padding: 32px 56px"][style*="border-top"] > div:last-child,
      [style*="padding: 32px 20px"][style*="border-top"] > div:last-child {
        flex-wrap: wrap !important;
        gap: 12px 18px !important;
      }

      /* Bio sidebar — unsticky on mobile so it doesn't take a full screen */
      [style*="position: sticky"][style*="top: 24px"] {
        position: static !important;
      }

      /* Music player (fixed bottom) — stack rows, drop dividers */
      [style*="position: fixed"][style*="bottom: 0"] > div {
        flex-direction: column !important;
      }
      [style*="position: fixed"][style*="bottom: 0"] > div > div {
        min-width: 0 !important;
        border-right: none !important;
        border-left: none !important;
        border-top: 1px solid rgba(21,23,27,0.08) !important;
      }
      [style*="position: fixed"][style*="bottom: 0"] > div > div:first-child {
        border-top: none !important;
        padding: 10px 16px !important;
      }
      [style*="position: fixed"][style*="bottom: 0"] iframe {
        height: 80px !important;
      }

      /* Pull the page up so the fixed player doesn't cover the last row */
      [style*="padding-bottom: 240px"] { padding-bottom: 320px !important; }

      /* Tweaks panel — keep visible but reduce footprint on phone */
      .twk-panel { width: calc(100vw - 24px) !important; right: 12px !important; bottom: 12px !important; max-height: 60vh !important; }
    }

    /* Extra-small phones */
    @media (max-width: 480px) {
      [style*="padding: 64px 56px"],
      [style*="padding: 56px 56px"],
      [style*="padding: 48px 56px"],
      [style*="padding: 40px 56px"],
      [style*="padding: 32px 56px"],
      [style*="padding: 0 56px"],
      [style*="padding: 0px 56px"] {
        padding-left: 16px !important;
        padding-right: 16px !important;
      }
      [style*="font-size: 96px"] { font-size: 44px !important; }
      [style*="font-size: 88px"] { font-size: 40px !important; }
      [style*="font-size: 56px"] { font-size: 30px !important; }
      [style*="font-size: 32px"] { font-size: 18px !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="data.js"></script>
  <script type="text/babel" src="variantA.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script data-goatcounter="https://chhan.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#6E1F2E",
      "portrait": "assets/images/photos/Han-main-profile.png",
      "showSlogan": true
    }/*EDITMODE-END*/;

    // Pages registry — single source of truth
    const PAGES = ['Home', 'Research', 'Creation', 'Bio'];
    const COMPONENT = { Home: window.HomeA, Research: window.ResearchA, Creation: window.CreationA, Bio: window.BioA };

    function App() {
      // Tweaks
      const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
      // Apply accent to A theme (window.A is mutable; rerender will re-read)
      React.useEffect(() => {
        if (tweaks.accent) window.A.accent = tweaks.accent;
        if (tweaks.portrait) window.SiteData.profile.portrait = tweaks.portrait;
      }, [tweaks.accent, tweaks.portrait]);

      // Hash-based routing so refresh preserves page
      const getPageFromHash = () => {
        const h = (window.location.hash || '').replace('#/', '').toLowerCase();
        const match = PAGES.find((p) => p.toLowerCase() === h);
        return match || 'Home';
      };
      const [page, setPage] = React.useState(getPageFromHash);
      React.useEffect(() => {
        const onHash = () => {
          setPage(getPageFromHash());
          if (window.goatcounter && window.goatcounter.count) {
            window.goatcounter.count({
              path: location.pathname + location.hash,
            });
          }
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const onNav = (p) => {
        if (p === page) return;
        window.location.hash = '/' + p.toLowerCase();
        // Scroll to top inside the parent frame (avoid scrollIntoView per guidance)
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      };

      // Force-rerender pages when accent changes (since A is referenced by mutation, we need a re-mount or stale key)
      const key = page + '-' + tweaks.accent;

      const Page = COMPONENT[page];

      return (
        <>
          <div key={key} className="page-fade">
            <Page onNav={onNav} tweaks={tweaks} />
          </div>

          <window.TweaksPanel title="Tweaks">
            <window.TweakSection label="Color">
              <window.TweakColor
                label="Accent"
                value={tweaks.accent}
                onChange={(v) => setTweak('accent', v)}
                options={['#1B3F7A', '#6E1F2E', '#1F4F3C', '#2A2A2A', '#B85C26']}
              />
            </window.TweakSection>

            <window.TweakSection label="Hero">
              <window.TweakToggle
                label="Show 'Researcher · Producer' strip"
                value={tweaks.showSlogan}
                onChange={(v) => setTweak('showSlogan', v)}
              />
            </window.TweakSection>

            <window.TweakSection label="Photo">
              <window.TweakSelect
                label="Portrait"
                value={tweaks.portrait}
                onChange={(v) => setTweak('portrait', v)}
                options={[
                  { label: 'Han-main-profile.png', value: 'assets/images/photos/Han-main-profile.png' },
                  { label: 'profile1.jpg', value: 'assets/images/photos/profile1.jpg' },
                  { label: 'profile2.jpg', value: 'assets/images/photos/profile2.jpg' },
                ]}
              />
            </window.TweakSection>
          </window.TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
