short_bio: >-
  <p>
    I am a Ph.D. student at <a href="https://www.chalmers.se/en/" target="_blank">Chalmers University of Technology</a>, affiliated with <a href="https://wasp-hs.org/" target="_blank">WASP-HS</a> (Wallenberg AI, Autonomous Systems and Software Program – Humanity and Society).
    My research focuses on learned cultural representation spaces in generative AI for creative domains.
    Learn more about my research <a href="https://chh-han.github.io/research">here</a>.
  </p>
  <p>
    Research keywords include: <span class="text-hl">Multimodal Learning</span>, <span class="text-hl">Signal Processing</span>, <span class="text-hl">Natural Language Processing</span>, <span class="text-hl">Music Information Retrieval</span>.
  </p>
  <div class="h6 mt-5">Brief Biography</div>
  <p>
    Before starting my Ph.D., I was a Research Engineer at <a href="https://www.smu.edu.sg/" target="_blank">Singapore Management University</a> working on career trajectory analysis using dynamic GNNs.
    I completed a research internship at <a href="https://www.sony.com/" target="_blank">SONY Europe</a>, where I worked on fine-grained instrument music source separation using text-audio multimodal encoders.
    I received my M.S. in Artificial Intelligence from <a href="https://www.hanyang.ac.kr/web/eng" target="_blank">Hanyang University</a> in 2025, advised by <a href="https://scholar.google.com/citations?user=ADVISOR_ID" target="_blank">Prof. Minsam Ko</a>.
    Prior to academia, I worked as a Data Analyst at <a href="https://www.coupang.com/" target="_blank">Coupang</a> and spent 7 years as a professional music producer, with tracks featured in Spotify K-pop Editorial Playlists reaching over 800K streams.
  </p>

